<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Карта опасностей РФ — U913</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.4.0/ol.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.4.0/dist/ol.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; background: #0a0a0a; }
        #map { width: 100vw; height: 100vh; background: #000; }

        .orbit-clock {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1100;
            font-family: 'Orbitron', monospace;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .orbit-time { font-size: 36px; font-weight: 700; color: #fff; letter-spacing: 3px; }
        .orbit-date { font-size: 12px; color: #aaa; margin-top: 5px; }

        .legend-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 260px;
            background: rgba(10, 15, 25, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 1000;
            padding: 12px 18px;
            font-size: 12px;
        }
        .legend-title { font-weight: bold; font-size: 13px; color: #fff; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; }
        .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: #ddd; }
        .color-box { width: 20px; height: 20px; border-radius: 4px; }
        .color-clear { background: rgba(42,42,42,0.6); border: 1px solid #555; }
        .color-danger { background: #cc9900; border: 1px solid #ffdd66; }
        .color-attack { background: #cc0000; border: 1px solid #ff6666; }
        .color-missile { background: #800020; border: 1px solid #ff8888; }

        .ol-popup {
            background: rgba(10,15,25,0.95);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            border-left: 4px solid #ff4444;
            color: #f0f0f0;
            padding: 10px 14px;
            min-width: 180px;
            font-size: 13px;
        }
        .popup-closer { float: right; font-size: 18px; color: #aaa; cursor: pointer; margin-left: 10px; text-decoration: none; }

        /* Водяные знаки */
        .watermark-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1150;
            pointer-events: none;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 180px, rgba(180,200,240,0.08) 180px, rgba(180,200,240,0.08) 240px);
        }
        .watermark-corner {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 1200;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            color: rgba(210,220,250,0.35);
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(3px);
            padding: 5px 12px;
            border-radius: 30px;
            letter-spacing: 1.5px;
            pointer-events: none;
            border: 0.5px solid rgba(255,255,240,0.2);
        }
        .watermark-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            z-index: 1155;
            font-family: 'Orbitron', monospace;
            font-size: 42px;
            font-weight: 900;
            color: rgba(170,190,230,0.1);
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div class="watermark-bg"></div>
<div class="watermark-center">@bplamap</div>
<div class="watermark-corner">@bplamap</div>

<div class="orbit-clock">
    <div class="orbit-time" id="orbitTime">--:--</div>
    <div class="orbit-date" id="orbitDate"></div>
</div>

<div class="legend-panel">
    <div class="legend-title">🚨 ТИПЫ УГРОЗ</div>
    <div class="legend-item"><div class="color-box color-clear"></div> Отбой / Спокойно</div>
    <div class="legend-item"><div class="color-box color-danger"></div> Опасность БПЛА</div>
    <div class="legend-item"><div class="color-box color-attack"></div> Тревога БПЛА</div>
    <div class="legend-item"><div class="color-box color-missile"></div> Ракетная опасность</div>
</div>

<script>
    const API_URL = 'https://radar-u913.onrender.com/api/statuses';
    const EXCLUDED = ["Донецкая Народная Республика", "Луганская Народная Республика", "Запорожская область", "Херсонская область", "ДНР", "ЛНР"];
    const MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

    const CITY_MAP = {
        "Москва":"Москва","Санкт-Петербург":"Ленинградская область","Казань":"Республика Татарстан",
        "Екатеринбург":"Свердловская область","Новосибирск":"Новосибирская область","Краснодар":"Краснодарский край"
    };
    const ALIAS = {
        "Москва":"Москва","Московская обл.":"Московская область","Татарстан":"Республика Татарстан",
        "Краснодарский край":"Краснодарский край","Ленинградская область":"Ленинградская область"
    };
    function normName(n){
        if(!n) return n;
        if(CITY_MAP[n]) return ALIAS[CITY_MAP[n]] || CITY_MAP[n];
        if(ALIAS[n]) return ALIAS[n];
        return n.trim();
    }

    let regionStatus = new Map();
    function getStat(r){ return regionStatus.get(normName(r)) || 'clear'; }

    async function fetchAlerts(){
        try{
            const resp=await fetch(API_URL);
            const data=await resp.json();
            if(data?.regions){
                regionStatus.clear();
                for(let [name,info] of Object.entries(data.regions)){
                    if(EXCLUDED.includes(name)) continue;
                    regionStatus.set(normName(name), info.status || 'clear');
                }
                updateLayers();
            }
        }catch(e){ console.error(e); }
    }

    const map = new ol.Map({
        target:'map',
        layers:[new ol.layer.Tile({ source: new ol.source.XYZ({ url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', subdomains:'abcd' }) })],
        view: new ol.View({ center: ol.proj.fromLonLat([60,65]), zoom:4 })
    });

    let srcClear=new ol.source.Vector(), srcDanger=new ol.source.Vector(), srcAttack=new ol.source.Vector(), srcMissile=new ol.source.Vector();
    const lClear=new ol.layer.Vector({ source:srcClear, style:new ol.style.Style({ fill:new ol.style.Fill({ color:'rgba(42,42,42,0.6)' }), stroke:new ol.style.Stroke({ color:'#555',width:1 }) }), zIndex:5 });
    const lDanger=new ol.layer.Vector({ source:srcDanger, style:new ol.style.Style({ fill:new ol.style.Fill({ color:'rgba(204,153,0,0.65)' }), stroke:new ol.style.Stroke({ color:'#cc9900',width:2 }) }), zIndex:6 });
    const lAttack=new ol.layer.Vector({ source:srcAttack, style:new ol.style.Style({ fill:new ol.style.Fill({ color:'rgba(204,0,0,0.7)' }), stroke:new ol.style.Stroke({ color:'#cc0000',width:2 }) }), zIndex:7 });
    const lMissile=new ol.layer.Vector({ source:srcMissile, style:new ol.style.Style({ fill:new ol.style.Fill({ color:'rgba(128,0,32,0.75)' }), stroke:new ol.style.Stroke({ color:'#800020',width:2.2 }) }), zIndex:8 });
    map.addLayer(lClear); map.addLayer(lDanger); map.addLayer(lAttack); map.addLayer(lMissile);

    let allFeatures=new Map();
    const labelSrc=new ol.source.Vector();
    const labelLayer=new ol.layer.Vector({ source:labelSrc, style: (f)=>{
        let z=map.getView().getZoom(), name=f.get('name');
        if(!name||z<3) return new ol.style.Style();
        return new ol.style.Style({ text:new ol.style.Text({ text:name, font:`500 ${z<5?'10px':'12px'} "Segoe UI"`, fill:new ol.style.Fill({ color:'#fff' }), stroke:new ol.style.Stroke({ color:'#000',width:2.5 }) }) });
    }, zIndex:20, declutter:true });
    map.addLayer(labelLayer);

    fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/russia.geojson')
        .then(r=>r.json())
        .then(geo=>{
            const fmt=new ol.format.GeoJSON();
            const features=fmt.readFeatures(geo,{ featureProjection:'EPSG:3857' });
            features.forEach(f=>{
                let name=f.get('name');
                if(!name||EXCLUDED.some(ex=>name.includes(ex))) return;
                let norm=normName(name);
                f.set('name',norm);
                if(allFeatures.has(norm)){
                    let old=allFeatures.get(norm);
                    old.setGeometry(new ol.geom.GeometryCollection([old.getGeometry(),f.getGeometry()]));
                } else allFeatures.set(norm,f);
            });
            for(let [name,feat] of allFeatures){
                let geom=feat.getGeometry();
                let pt=null;
                if(geom.getType()==='Polygon') pt=geom.getInteriorPoint();
                else if(geom.getType()==='MultiPolygon' && geom.getPolygons) pt=geom.getPolygons()[0]?.getInteriorPoint();
                if(pt){ let lf=new ol.Feature(pt); lf.set('name',name); labelSrc.addFeature(lf); }
            }
            updateLayers();
        });

    function updateLayers(){
        srcClear.clear(); srcDanger.clear(); srcAttack.clear(); srcMissile.clear();
        for(let [name,feat] of allFeatures){
            let stat=getStat(name);
            let clone=feat.clone();
            if(stat==='missile_alert') srcMissile.addFeature(clone);
            else if(stat==='drone_attack') srcAttack.addFeature(clone);
            else if(stat==='drone_danger') srcDanger.addFeature(clone);
            else srcClear.addFeature(clone);
        }
    }

    // Popup
    const popupDiv=document.createElement('div'); popupDiv.className='ol-popup';
    const closer=document.createElement('a'); closer.href='#'; closer.innerHTML='×'; closer.className='popup-closer';
    closer.onclick=()=>{ popup.setPosition(undefined); return false; };
    popupDiv.appendChild(closer);
    const popupText=document.createElement('div'); popupDiv.appendChild(popupText);
    const popup=new ol.Overlay({ element:popupDiv, autoPan:true, offset:[10,-10] });
    map.addOverlay(popup);
    map.on('singleclick',(e)=>{
        let hit=null;
        [lClear,lDanger,lAttack,lMissile].some(layer=>{ map.forEachFeatureAtPixel(e.pixel, f=>{ hit=f; return true; },{ layerFilter:l=>l===layer }); return hit; });
        if(hit){
            let name=hit.get('name');
            let stat=getStat(name);
            let txt=`<b>${name}</b><br>`;
            if(stat==='missile_alert') txt+='<span style="color:#ff8888">🚀 РАКЕТНАЯ ОПАСНОСТЬ</span>';
            else if(stat==='drone_attack') txt+='<span style="color:#ff8888">🔴 ТРЕВОГА БПЛА</span>';
            else if(stat==='drone_danger') txt+='<span style="color:#ffcc66">🟡 ОПАСНОСТЬ БПЛА</span>';
            else txt+='<span style="color:#80c080">🟢 Отбой</span>';
            popupText.innerHTML=txt;
            popup.setPosition(e.coordinate);
        } else popup.setPosition(undefined);
    });

    function updateClock(){
        let d=new Date().toLocaleString('ru',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit'});
        let date=new Date().toLocaleString('ru',{timeZone:'Europe/Moscow',day:'2-digit',month:'long',year:'numeric'});
        document.getElementById('orbitTime').innerText=d;
        document.getElementById('orbitDate').innerText=date;
    }
    updateClock(); setInterval(updateClock,1000);
    fetchAlerts(); setInterval(fetchAlerts,15000);
</script>
</body>
</html>
