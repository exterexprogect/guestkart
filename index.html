<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Карта тревог РФ — Новый API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.4.0/ol.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.4.0/dist/ol.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; background: #0a0a0a; }
        #map { width: 100vw; height: 100vh; background: #000; }

        .orbit-clock {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1100;
            background: transparent;
            font-family: 'Orbitron', monospace;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .orbit-time { font-size: 36px; font-weight: 700; color: #ffffff; letter-spacing: 3px; line-height: 1; }
        .orbit-date { font-size: 12px; font-weight: 400; color: #aaaaaa; letter-spacing: 1px; margin-top: 5px; }

        .legend-summary-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 320px;
            max-height: calc(100vh - 100px);
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            font-size: 12px;
        }
        .legend-header {
            padding: 12px 18px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .legend-toggle { font-size: 14px; transition: transform 0.2s; }
        .legend-items {
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #ddd; }
        .color-box { width: 20px; height: 20px; border-radius: 4px; }
        .color-clear { background: #1a1a1a; border: 2px solid #555; }
        .color-danger { background: #b38600; border: 2px solid #ffdd66; }
        .color-attack { background: #cc1a1a; border: 2px solid #ff8888; }
        .color-missile { background: #660000; border: 2px solid #ffaaaa; }

        .summary-header {
            padding: 12px 18px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-arrow { font-size: 14px; transition: transform 0.2s; }
        .summary-content {
            padding: 12px 16px;
            overflow-y: auto;
            max-height: 300px;
        }
        .summary-content.collapsed { display: none; }
        .summary-content::-webkit-scrollbar { width: 4px; }
        .summary-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .summary-content::-webkit-scrollbar-thumb { background: #ffaa55; border-radius: 10px; }
        .summary-time {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace;
        }
        .threat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 12px;
            border-left: 3px solid #ff4444;
            padding-left: 10px;
            margin-bottom: 6px;
            color: #ffcccc;
        }
        .region-list-block {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-left: 16px;
            margin-bottom: 12px;
        }
        .region-line {
            font-size: 11px;
            color: #ffdd99;
            display: block;
            line-height: 1.35;
            cursor: pointer;
            transition: 0.1s;
        }
        .region-line:hover { color: #ffffff; text-shadow: 0 0 3px #ffaa55; }
        .sub-header { font-size: 11px; font-weight: 600; color: #ffaa66; margin: 8px 0 4px 0; }
        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 0;
            border-radius: 40px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            margin-top: 12px;
            transition: 0.2s;
            width: 100%;
        }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .empty-message { color: #aaa; font-style: italic; font-size: 11px; padding: 6px 0; }

        .ol-popup {
            background: rgba(10,15,25,0.9);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            border-left: 4px solid #ff4444;
            color: #f0f0f0;
            padding: 12px;
            min-width: 200px;
            pointer-events: auto;
            position: absolute;
        }
        .popup-closer {
            float: right;
            font-size: 18px;
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="map"></div>

<div class="orbit-clock">
    <div class="orbit-time" id="orbitTime">--:--</div>
    <div class="orbit-date" id="orbitDate"></div>
</div>

<div class="legend-summary-panel" id="legendSummaryPanel">
    <div class="legend-header" id="legendHeader">
        <span>🚨 ТИПЫ УГРОЗ</span>
        <span class="legend-toggle" id="legendToggle">▼</span>
    </div>
    <div class="legend-items" id="legendItems">
        <div class="legend-item"><div class="color-box color-clear"></div> Отбой / Спокойно</div>
        <div class="legend-item"><div class="color-box color-danger"></div> 🟡 Опасность БПЛА</div>
        <div class="legend-item"><div class="color-box color-attack"></div> 🔴 Тревога / Атака БПЛА</div>
        <div class="legend-item"><div class="color-box color-missile"></div> 🚀 Ракетная опасность</div>
    </div>

    <div class="summary-header" id="summaryHeader">
        <span>📜 СВОДКА УГРОЗ</span>
        <span class="summary-arrow" id="summaryArrow">▼</span>
    </div>
    <div class="summary-content" id="summaryContent">
        <div id="dynamicSummaryBlock"></div>
        <div class="copy-btn" id="copySummaryBtn">📋 Копировать сводку</div>
    </div>
</div>

<script>
    // =============================================
    // НОВЫЙ API
    // =============================================
    const API_URL = 'https://radar-n6y0.onrender.com/api/statuses';
    
    const EXCLUDED_REGIONS = [
        "Донецкая Народная Республика",
        "Луганская Народная Республика",
        "Запорожская область",
        "Херсонская область",
        "ДНР", "ЛНР"
    ];

    const MONTHS_RU = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

    // Словарь для нормализации названий регионов (приводим к единому формату)
    const regionNameMap = {
        "Брянская область": "Брянская область",
        "Калужская область": "Калужская область",
        "Курская область": "Курская область",
        "Ленинградская область": "Ленинградская область",
        "Московская область": "Московская область",
        "Нижегородская область": "Нижегородская область",
        "Орловская область": "Орловская область",
        "Ростовская область": "Ростовская область",
        "Санкт-Петербург": "Санкт-Петербург",
        "Смоленская область": "Смоленская область",
        "Тамбовская область": "Тамбовская область",
        "Тульская область": "Тульская область",
        "Ульяновская область": "Ульяновская область",
        "Ярославская область": "Ярославская область",
        "Москва": "Москва",
        "Республика Татарстан": "Республика Татарстан",
        "Республика Башкортостан": "Республика Башкортостан",
        "Краснодарский край": "Краснодарский край",
        "Ставропольский край": "Ставропольский край",
        "Пермский край": "Пермский край",
        "Республика Крым": "Республика Крым",
        "Севастополь": "Севастополь",
        "Волгоградская область": "Волгоградская область",
        "Саратовская область": "Саратовская область",
        "Самарская область": "Самарская область",
        "Челябинская область": "Челябинская область",
        "Свердловская область": "Свердловская область",
        "Новосибирская область": "Новосибирская область",
        "Омская область": "Омская область",
        "Красноярский край": "Красноярский край",
        "Иркутская область": "Иркутская область",
        "Хабаровский край": "Хабаровский край",
        "Приморский край": "Приморский край"
    };

    function normalizeRegionName(apiName) {
        // Прямое совпадение
        if (regionNameMap[apiName]) return regionNameMap[apiName];
        
        // Убираем лишние пробелы
        const trimmed = apiName.trim();
        if (regionNameMap[trimmed]) return regionNameMap[trimmed];
        
        return apiName;
    }

    function getCurrentTimeParts() {
        const now = new Date();
        const msk = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
        const hours = msk.getHours().toString().padStart(2, '0');
        const minutes = msk.getMinutes().toString().padStart(2, '0');
        const day = msk.getDate().toString().padStart(2, '0');
        const month = (msk.getMonth() + 1).toString().padStart(2, '0');
        const monthName = MONTHS_RU[msk.getMonth()];
        const year = msk.getFullYear();
        return { time: `${hours}:${minutes}`, day, month, monthName, year };
    }

    function getFullDateForSummary() {
        const { time, day, month } = getCurrentTimeParts();
        return `${time} | ${day}.${month}`;
    }

    function getFullDateForClock() {
        const { day, monthName, year } = getCurrentTimeParts();
        return `${day} ${monthName} ${year}`;
    }

    let regionStatuses = new Map();
    
    function getRegionStatus(regionName) {
        const canonical = normalizeRegionName(regionName);
        return regionStatuses.get(canonical) || 'clear';
    }
    
    async function fetchAlerts() {
        try {
            const resp = await fetch(API_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const apiData = await resp.json();
            
            if (apiData && apiData.regions) {
                regionStatuses.clear();
                for (const [regionName, info] of Object.entries(apiData.regions)) {
                    if (EXCLUDED_REGIONS.includes(regionName)) continue;
                    let status = info.status || 'clear';
                    const canonical = normalizeRegionName(regionName);
                    regionStatuses.set(canonical, status);
                    console.log(`Регион: ${regionName} -> ${canonical} -> статус: ${status}`);
                }
                updateAllLayers();
                renderFullSummary();
            }
        } catch (err) { console.error('Ошибка API:', err); }
    }

    // ========== КАРТА ==========
    const map = new ol.Map({
        target: 'map',
        layers: [
            new ol.layer.Tile({ source: new ol.source.XYZ({ url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', subdomains: 'abcd' }) })
        ],
        view: new ol.View({
            center: ol.proj.fromLonLat([60, 65]),
            zoom: 4,
            minZoom: 3,
            maxZoom: 10,
            constrainRotation: true,
            enableRotation: false
        }),
        controls: []
    });

    let clearSource = new ol.source.Vector();
    let dangerSource = new ol.source.Vector();
    let attackSource = new ol.source.Vector();
    let missileSource = new ol.source.Vector();

    const clearStyle = new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(26, 26, 26, 0.6)' }),
        stroke: new ol.style.Stroke({ color: '#555555', width: 2 })
    });
    
    const dangerStyle = new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(179, 134, 0, 0.75)' }),
        stroke: new ol.style.Stroke({ color: '#ffdd66', width: 2 })
    });
    
    const attackStyle = new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(204, 26, 26, 0.8)' }),
        stroke: new ol.style.Stroke({ color: '#ff8888', width: 2 })
    });
    
    const missileStyle = new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(102, 0, 0, 0.85)' }),
        stroke: new ol.style.Stroke({ color: '#ffaaaa', width: 2 })
    });

    const clearLayer = new ol.layer.Vector({ source: clearSource, style: clearStyle, zIndex: 5 });
    const dangerLayer = new ol.layer.Vector({ source: dangerSource, style: dangerStyle, zIndex: 6 });
    const attackLayer = new ol.layer.Vector({ source: attackSource, style: attackStyle, zIndex: 7 });
    const missileLayer = new ol.layer.Vector({ source: missileSource, style: missileStyle, zIndex: 8 });

    map.addLayer(clearLayer);
    map.addLayer(dangerLayer);
    map.addLayer(attackLayer);
    map.addLayer(missileLayer);

    const labelSource = new ol.source.Vector();
    const labelLayer = new ol.layer.Vector({
        source: labelSource,
        style: (feature) => {
            const zoom = map.getView().getZoom();
            let name = feature.get('name');
            if (!name || zoom < 3) return new ol.style.Style();
            
            const shortNames = {
                "Республика Татарстан": "Татарстан",
                "Республика Башкортостан": "Башкортостан",
                "Удмуртская Республика": "Удмуртия",
                "Чувашская Республика": "Чувашия",
                "Республика Марий Эл": "Марий Эл",
                "Краснодарский край": "Краснодарский кр.",
                "Ставропольский край": "Ставропольский кр.",
                "Пермский край": "Пермский кр."
            };
            const displayName = shortNames[name] || name;
            
            function splitName(n) {
                const spaceIndex = n.indexOf(' ');
                if (spaceIndex > 0 && n.length - spaceIndex < 25) {
                    return [n.substring(0, spaceIndex), n.substring(spaceIndex + 1)];
                }
                return [n];
            }
            
            const lines = splitName(displayName);
            const fontSize = zoom < 5 ? '10px' : '12px';
            
            return new ol.style.Style({
                text: new ol.style.Text({
                    text: lines.join('\n'),
                    font: `500 ${fontSize} "Segoe UI"`,
                    fill: new ol.style.Fill({ color: '#ffffff' }),
                    stroke: new ol.style.Stroke({ color: '#000000', width: 2.5 }),
                    textAlign: 'center',
                    offsetY: 0
                })
            });
        },
        zIndex: 20,
        declutter: true
    });
    map.addLayer(labelLayer);

    let allFeaturesMap = new Map();

    fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/russia.geojson')
        .then(r => r.json())
        .then(geojson => {
            const format = new ol.format.GeoJSON();
            const features = format.readFeatures(geojson, { featureProjection: 'EPSG:3857' });
            
            let moscowRegionFeatures = [];
            
            features.forEach(feature => {
                let name = feature.get('name');
                if (!name) return;
                if (EXCLUDED_REGIONS.some(ex => name.includes(ex))) return;
                
                const normalized = normalizeRegionName(name);
                feature.set('name', normalized);
                
                if (normalized === "Московская область") {
                    moscowRegionFeatures.push(feature);
                    return;
                }
                
                if (normalized === "Москва") {
                    allFeaturesMap.set("Москва", feature);
                    return;
                }
                
                if (allFeaturesMap.has(normalized)) {
                    const existingFeature = allFeaturesMap.get(normalized);
                    const existingGeom = existingFeature.getGeometry();
                    const newGeom = feature.getGeometry();
                    const collection = new ol.geom.GeometryCollection([existingGeom, newGeom]);
                    existingFeature.setGeometry(collection);
                } else {
                    allFeaturesMap.set(normalized, feature);
                }
            });
            
            if (moscowRegionFeatures.length > 0) {
                const geoms = moscowRegionFeatures.map(f => f.getGeometry());
                const collection = new ol.geom.GeometryCollection(geoms);
                const mergedFeature = moscowRegionFeatures[0].clone();
                mergedFeature.setGeometry(collection);
                mergedFeature.set('name', "Московская область");
                allFeaturesMap.set("Московская область", mergedFeature);
            }
            
            for (let [name, feature] of allFeaturesMap) {
                const geom = feature.getGeometry();
                let centerPoint = null;
                if (geom.getType() === 'MultiPolygon') {
                    let maxArea = 0, largest;
                    if (geom.getPolygons) {
                        geom.getPolygons().forEach(p => { const area = p.getArea(); if (area > maxArea) { maxArea = area; largest = p; } });
                        if (largest) centerPoint = largest.getInteriorPoint();
                    }
                } else if (geom.getType() === 'Polygon') {
                    centerPoint = geom.getInteriorPoint();
                } else if (geom.getType() === 'GeometryCollection') {
                    const geometries = geom.getGeometries();
                    for (let g of geometries) {
                        if (g.getType() === 'Polygon') {
                            centerPoint = g.getInteriorPoint();
                            break;
                        } else if (g.getType() === 'MultiPolygon' && g.getPolygons) {
                            const polys = g.getPolygons();
                            if (polys.length > 0) {
                                centerPoint = polys[0].getInteriorPoint();
                                break;
                            }
                        }
                    }
                }
                if (centerPoint && !labelSource.getFeatures().some(f => f.get('name') === name)) {
                    const labelFeature = new ol.Feature(centerPoint);
                    labelFeature.set('name', name);
                    labelSource.addFeature(labelFeature);
                }
            }
            
            updateAllLayers();
            renderFullSummary();
            fetchAlerts();
            setInterval(fetchAlerts, 15000);
        })
        .catch(console.error);

    function updateAllLayers() {
        clearSource.clear();
        dangerSource.clear();
        attackSource.clear();
        missileSource.clear();
        
        for (let [name, feature] of allFeaturesMap) {
            const status = getRegionStatus(name);
            const clone = feature.clone();
            clone.set('name', name);
            
            if (status === 'missile_alert') {
                missileSource.addFeature(clone);
            } else if (status === 'drone_attack') {
                attackSource.addFeature(clone);
            } else if (status === 'drone_danger') {
                dangerSource.addFeature(clone);
            } else {
                clearSource.addFeature(clone);
            }
        }
        map.render();
    }

    function renderFullSummary() {
        let attack = [], danger = [];
        for (let [name, status] of regionStatuses.entries()) {
            if (status === 'missile_alert' || status === 'drone_attack') attack.push(name);
            else if (status === 'drone_danger') danger.push(name);
        }
        attack.sort(); danger.sort();
        
        const dateTimeStr = getFullDateForSummary();
        
        let html = '';
        html += `<div class="summary-time">🕐 ${dateTimeStr}</div>`;
        html += `<div class="threat-header">🔴 Атака / Внимание БПЛА / ракет</div><div class="region-list-block">`;
        if (attack.length) attack.forEach(r => html += `<span class="region-line" data-region="${r}">• ${r}</span>`);
        else html += `<div class="empty-message">— нет угроз —</div>`;
        html += `</div><div class="sub-header">🟡 Опасность БПЛА</div><div class="region-list-block">`;
        if (danger.length) danger.forEach(r => html += `<span class="region-line" data-region="${r}">• ${r}</span>`);
        else html += `<div class="empty-message">— нет угроз —</div>`;
        html += `</div>`;
        document.getElementById('dynamicSummaryBlock').innerHTML = html;
        
        document.querySelectorAll('.region-line').forEach(el => {
            el.addEventListener('click', (e) => {
                const regionName = el.dataset.region;
                const feature = allFeaturesMap.get(regionName);
                if (feature) {
                    const geom = feature.getGeometry();
                    if (geom) map.getView().fit(geom.getExtent(), { padding: [50,50,50,50], maxZoom: 8 });
                }
            });
        });
    }

    document.getElementById('copySummaryBtn').addEventListener('click', () => {
        let attack = [], danger = [];
        for (let [name, status] of regionStatuses.entries()) {
            if (status === 'missile_alert' || status === 'drone_attack') attack.push(name);
            else if (status === 'drone_danger') danger.push(name);
        }
        const dateTimeStr = getFullDateForSummary();
        let text = `✈️ Тревоги на территории РФ ${dateTimeStr}\n\n`;
        text += `🔴 АКТИВНАЯ ТРЕВОГА (БПЛА/Ракеты):\n`;
        if (attack.length) attack.forEach(r => text += `  • ${r}\n`);
        else text += `  — нет угроз —\n`;
        text += `\n🟡 ПОТЕНЦИАЛЬНАЯ ОПАСНОСТЬ (БПЛА):\n`;
        if (danger.length) danger.forEach(r => text += `  • ${r}\n`);
        else text += `  — нет угроз —\n`;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copySummaryBtn');
        btn.textContent = '✅ Скопировано!';
        setTimeout(() => btn.textContent = '📋 Копировать сводку', 1500);
    });

    // Попап
    const popupElement = document.createElement('div');
    popupElement.className = 'ol-popup';
    const popupCloser = document.createElement('a');
    popupCloser.href = '#';
    popupCloser.className = 'popup-closer';
    popupCloser.innerHTML = '×';
    popupCloser.onclick = () => { popupOverlay.setPosition(undefined); return false; };
    popupElement.appendChild(popupCloser);
    const popupContent = document.createElement('div');
    popupElement.appendChild(popupContent);
    
    const popupOverlay = new ol.Overlay({ element: popupElement, autoPan: true, offset: [10, -10] });
    map.addOverlay(popupOverlay);
    
    map.on('singleclick', (evt) => {
        let feature = null;
        const layers = [clearLayer, dangerLayer, attackLayer, missileLayer];
        for (const layer of layers) {
            map.forEachFeatureAtPixel(evt.pixel, (f) => { feature = f; return true; }, { layerFilter: (l) => l === layer });
            if (feature) break;
        }
        if (feature) {
            const name = feature.get('name');
            const status = getRegionStatus(name);
            let html = `<div style="font-weight: bold; font-size: 14px; margin-bottom: 6px; border-bottom: 1px solid #333;">${name}</div>`;
            if (status === 'missile_alert') html += `<div style="color: #ff6666; font-weight: bold;">🚀 РАКЕТНАЯ ОПАСНОСТЬ</div>`;
            else if (status === 'drone_attack') html += `<div style="color: #ff6666; font-weight: bold;">🔴 ТРЕВОГА БПЛА</div>`;
            else if (status === 'drone_danger') html += `<div style="color: #ffcc66; font-weight: bold;">🟡 ОПАСНОСТЬ БПЛА</div>`;
            else html += `<div style="color: #80c080;">🟢 Отбой / спокойно</div>`;
            popupContent.innerHTML = html;
            popupOverlay.setPosition(evt.coordinate);
        } else {
            popupOverlay.setPosition(undefined);
        }
    });

    // Свёртывание легенды
    const legendHeader = document.getElementById('legendHeader');
    const legendItems = document.getElementById('legendItems');
    const legendToggle = document.getElementById('legendToggle');
    legendHeader.addEventListener('click', () => {
        const isCollapsed = legendItems.style.display === 'none';
        if (isCollapsed) {
            legendItems.style.display = 'flex';
            legendToggle.innerHTML = '▼';
        } else {
            legendItems.style.display = 'none';
            legendToggle.innerHTML = '▲';
        }
    });

    // Свёртывание сводки
    const summaryHeader = document.getElementById('summaryHeader');
    const summaryContent = document.getElementById('summaryContent');
    const summaryArrow = document.getElementById('summaryArrow');
    summaryHeader.addEventListener('click', () => {
        const isCollapsed = summaryContent.classList.contains('collapsed');
        if (isCollapsed) {
            summaryContent.classList.remove('collapsed');
            summaryArrow.innerHTML = '▼';
        } else {
            summaryContent.classList.add('collapsed');
            summaryArrow.innerHTML = '▲';
        }
    });

    function updateOrbitClock() {
        const { time } = getCurrentTimeParts();
        const dateStr = getFullDateForClock();
        document.getElementById('orbitTime').innerHTML = time;
        document.getElementById('orbitDate').innerHTML = dateStr;
    }
    updateOrbitClock();
    setInterval(updateOrbitClock, 1000);
</script>
</body>
