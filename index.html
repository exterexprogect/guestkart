<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Карта тревог РФ — Полное соответствие API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.4.0/ol.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.4.0/dist/ol.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; background: #0a0a0a; }
        #map { width: 100vw; height: 100vh; background: #000; }

        .orbit-clock {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1100;
            background: transparent;
            font-family: 'Orbitron', monospace;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .orbit-time { font-size: 36px; font-weight: 700; color: #ffffff; letter-spacing: 3px; line-height: 1; }
        .orbit-date { font-size: 12px; font-weight: 400; color: #aaaaaa; letter-spacing: 1px; margin-top: 5px; }

        .legend-summary-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 320px;
            max-height: calc(100vh - 100px);
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            font-size: 12px;
        }
        .legend-header {
            padding: 12px 18px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .legend-toggle { font-size: 14px; transition: transform 0.2s; }
        .legend-items {
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #ddd; }
        .color-box { width: 20px; height: 20px; border-radius: 4px; }
        .color-clear { background: #1a1a1a; border: 2px solid #555; }
        .color-danger { background: #b38600; border: 2px solid #ffdd66; }
        .color-attack { background: #cc1a1a; border: 2px solid #ff8888; }
        .color-missile { background: #660000; border: 2px solid #ffaaaa; }

        .summary-header {
            padding: 12px 18px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-arrow { font-size: 14px; transition: transform 0.2s; }
        .summary-content {
            padding: 12px 16px;
            overflow-y: auto;
            max-height: 300px;
        }
        .summary-content.collapsed { display: none; }
        .summary-content::-webkit-scrollbar { width: 4px; }
        .summary-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .summary-content::-webkit-scrollbar-thumb { background: #ffaa55; border-radius: 10px; }
        .summary-time {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace;
        }
        .threat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 12px;
            border-left: 3px solid #ff4444;
            padding-left: 10px;
            margin-bottom: 6px;
            color: #ffcccc;
        }
        .region-list-block {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-left: 16px;
            margin-bottom: 12px;
        }
        .region-line {
            font-size: 11px;
            color: #ffdd99;
            display: block;
            line-height: 1.35;
            cursor: pointer;
            transition: 0.1s;
        }
        .region-line:hover { color: #ffffff; text-shadow: 0 0 3px #ffaa55; }
        .sub-header { font-size: 11px; font-weight: 600; color: #ffaa66; margin: 8px 0 4px 0; }
        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 0;
            border-radius: 40px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            margin-top: 12px;
            width: 100%;
        }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .empty-message { color: #aaa; font-style: italic; font-size: 11px; padding: 6px 0; }

        .ol-popup {
            background: rgba(10,15,25,0.9);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            border-left: 4px solid #ff4444;
            color: #f0f0f0;
            padding: 12px;
            min-width: 200px;
            pointer-events: auto;
            position: absolute;
        }
        .popup-closer {
            float: right;
            font-size: 18px;
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="map"></div>

<div class="orbit-clock">
    <div class="orbit-time" id="orbitTime">--:--</div>
    <div class="orbit-date" id="orbitDate"></div>
</div>

<div class="legend-summary-panel" id="legendSummaryPanel">
    <div class="legend-header" id="legendHeader">
        <span>🚨 ТИПЫ УГРОЗ</span>
        <span class="legend-toggle" id="legendToggle">▼</span>
    </div>
    <div class="legend-items" id="legendItems">
        <div class="legend-item"><div class="color-box color-clear"></div> Отбой / Спокойно</div>
        <div class="legend-item"><div class="color-box color-danger"></div> 🟡 Опасность БПЛА</div>
        <div class="legend-item"><div class="color-box color-attack"></div> 🔴 Тревога / Атака БПЛА</div>
        <div class="legend-item"><div class="color-box color-missile"></div> 🚀 Ракетная опасность</div>
    </div>

    <div class="summary-header" id="summaryHeader">
        <span>📜 СВОДКА УГРОЗ</span>
        <span class="summary-arrow" id="summaryArrow">▼</span>
    </div>
    <div class="summary-content" id="summaryContent">
        <div id="dynamicSummaryBlock"></div>
        <div class="copy-btn" id="copySummaryBtn">📋 Копировать сводку</div>
    </div>
</div>

<script>
    // =============================================
    // API
    // =============================================
    const API_URL = 'https://radar.ra5cq.ru/api/state';
    const WS_URL = 'ws://localhost:3000';
    
    const EXCLUDED_REGIONS = [
        "Донецкая Народная Республика",
        "Луганская Народная Республика",
        "Запорожская область",
        "Херсонская область",

    ];

    const MONTHS_RU = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

    // ========== ПОЛНОЕ СООТВЕТСТВИЕ: API ключ → Название региона на карте ==========
    const apiKeyToRegion = {
        // Центр
        "moscow_obl": "Московская область",
        "moscow": "Москва",
        "belgorod": "Белгородская область",

        // Северо-Запад
        "spb_leningrad": "Санкт-Петербург",

        "novgorod": "Новгородская область",
        "pskov": "Псковская область",
        "karelia": "Республика Карелия",
        "komi": "Республика Коми",
        "arkhangelsk": "Архангельская область",
        "murmansk": "Мурманская область",
        "kaliningrad": "Калининградская область",
        "vologda": "Вологодская область",
        
        // Юг
        "krasnodar": "Краснодарский край",
        "rostov": "Ростовская область",
        "volgograd": "Волгоградская область",
        "astrakhan": "Астраханская область",
        "adygea": "Республика Адыгея",
        "kalmykia": "Республика Калмыкия",
        "crimea": "Республика Крым",
        "sevastopol": "Севастополь",
        
        // Кавказ
        "dagestan": "Республика Дагестан",
        "chechnya": "Чеченская Республика",
        "ingushetia": "Республика Ингушетия",
        "kabardin": "Кабардино-Балкарская Республика",
        "karachay": "Карачаево-Черкесская Республика",
        "ossetia": "Республика Северная Осетия",
        "stavropol": "Ставропольский край",
        
        // Поволжье
        "tatarstan": "Республика Татарстан",
        "bashkortostan": "Республика Башкортостан",
        "udmurtia": "Удмуртская Республика",

        "mariy_el": "Республика Марий Эл",
        "mordovia": "Республика Мордовия",
        "samara": "Самарская область",
        "nizhny_novgorod": "Нижегородская область",
        "saratov": "Саратовская область",
        "penza": "Пензенская область",
        "ulyanovsk": "Ульяновская область",
        "kirov": "Кировская область",
        "perm": "Пермский край",
        "orenburg": "Оренбургская область",
        
        // Урал
        "sverdlovsk": "Свердловская область",
        "chelyabinsk": "Челябинская область",
        "kurgan": "Курганская область",
        "tyumen": "Тюменская область",
        "khmao": "Ханты-Мансийский АО",
        "yanao": "Ямало-Ненецкий АО",
        
        // Сибирь
        "omsk": "Омская область",
        "novosibirsk": "Новосибирская область",
        "tomsk": "Томская область",
        "kemerovo": "Кемеровская область",
        "irkutsk": "Иркутская область",
        "krasnoyarsk": "Красноярский край",
        "altai": "Алтайский край",
        "khakassia": "Республика Хакасия",
        "tuva": "Республика Тыва",
        "buryatia": "Республика Бурятия",
        
        // Дальний Восток
        "primorye": "Приморский край",
        "khabarovsk": "Хабаровский край",
        "amur": "Амурская область",
        "sakhalin": "Сахалинская область",
        "kamchatka": "Камчатский край",
        "magadan": "Магаданская область",
        "zabaykalsky": "Забайкальский край",
        "evreyskaya": "Еврейская АО",
        "chukotka": "Чукотский АО"
    };

    // Функция нормализации (приводит названия из GeoJSON к каноническому виду)
    const geoJsonNormalize = {
        "Московская обл.": "Московская область",
        "Ленинградская обл.": "Ленинградская область",
        "Санкт-Петербург": "Санкт-Петербург",
        "Республика Адыгея": "Республика Адыгея",
        "Республика Башкортостан": "Республика Башкортостан",
        "Республика Бурятия": "Республика Бурятия",
        "Республика Алтай": "Республика Алтай",
        "Республика Дагестан": "Республика Дагестан",
        "Республика Ингушетия": "Республика Ингушетия",
        "Республика Кабардино-Балкария": "Кабардино-Балкарская Республика",
        "Республика Калмыкия": "Республика Калмыкия",
        "Республика Карачаево-Черкесия": "Карачаево-Черкесская Республика",
        "Республика Карелия": "Республика Карелия",
        "Республика Коми": "Республика Коми",
        "Республика Крым": "Республика Крым",
        "Республика Марий Эл": "Республика Марий Эл",
        "Республика Мордовия": "Республика Мордовия",
        "Республика Саха (Якутия)": "Республика Саха (Якутия)",
        "Республика Северная Осетия": "Республика Северная Осетия",
        "Республика Татарстан": "Республика Татарстан",
        "Республика Тыва": "Республика Тыва",
        "Республика Хакасия": "Республика Хакасия",
        "Республика Удмуртия": "Удмуртская Республика",
        "Республика Чувашия": "Чувашская Республика",
        "Алтайский край": "Алтайский край",
        "Забайкальский край": "Забайкальский край",
        "Камчатский край": "Камчатский край",
        "Краснодарский край": "Краснодарский край",
        "Красноярский край": "Красноярский край",
        "Пермский край": "Пермский край",
        "Приморский край": "Приморский край",
        "Ставропольский край": "Ставропольский край",
        "Хабаровский край": "Хабаровский край"
    };

    function normalizeGeoJsonName(name) {
        if (!name) return name;
        return geoJsonNormalize[name] || name;
    }

    function getCurrentTimeParts() {
        const now = new Date();
        const msk = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
        const hours = msk.getHours().toString().padStart(2, '0');
        const minutes = msk.getMinutes().toString().padStart(2, '0');
        const day = msk.getDate().toString().padStart(2, '0');
        const month = (msk.getMonth() + 1).toString().padStart(2, '0');
        const monthName = MONTHS_RU[msk.getMonth()];
        const year = msk.getFullYear();
        return { time: `${hours}:${minutes}`, day, month, monthName, year };
    }

    function getFullDateForSummary() {
        const { time, day, month } = getCurrentTimeParts();
        return `${time} | ${day}.${month}`;
    }

    function getFullDateForClock() {
        const { day, monthName, year } = getCurrentTimeParts();
        return `${day} ${monthName} ${year}`;
    }

    let regionStatuses = new Map();
    let ws = null;
    let allFeaturesMap = new Map();
    let updateScheduled = false;

    function scheduleUpdate() {
        if (updateScheduled) return;
        updateScheduled = true;
        requestAnimationFrame(() => { updateAllLayers(); updateScheduled = false; });
    }

    function getRegionStatus(regionName) {
        // Ищем точное совпадение
        if (regionStatuses.has(regionName)) return regionStatuses.get(regionName);
        // Ищем по ключу в apiKeyToRegion
        for (const [apiKey, apiRegionName] of Object.entries(apiKeyToRegion)) {
            if (apiRegionName === regionName) {
                return regionStatuses.get(apiRegionName) || 'clear';
            }
        }
        return 'clear';
    }
    
    // ========== WEBSOCKET ==========
    function connectWebSocket() {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => console.log('✅ WebSocket подключён');
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log('📨 WebSocket:', data);
            if (data.type === 'init') {
                for (const [region, status] of data.statuses) {
                    regionStatuses.set(region, status);
                }
                scheduleUpdate();
                renderFullSummary();
            } else if (data.type === 'update') {
                if (data.status === 'clear') {
                    regionStatuses.delete(data.region);
                } else {
                    regionStatuses.set(data.region, data.status);
                }
                scheduleUpdate();
                renderFullSummary();
            }
        };
        ws.onclose = () => setTimeout(connectWebSocket, 5000);
    }
    
    // ========== API РЕЗЕРВ ==========
    async function fetchApiAlerts() {
        try {
            const resp = await fetch(API_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const apiData = await resp.json();
            
            for (const [apiKey, data] of Object.entries(apiData)) {
                if (apiKey === 'timestamp' || apiKey === 'version') continue;
                const regionName = apiKeyToRegion[apiKey];
                if (!regionName || EXCLUDED_REGIONS.includes(regionName)) continue;
                
                let status = 'clear';
                if (data.missile === 'alert') status = 'missile_alert';
                else if (data.uav === 'alert') status = 'drone_attack';
                else if (data.uav === 'warning') status = 'drone_danger';
                
                if (!regionStatuses.has(regionName)) {
                    regionStatuses.set(regionName, status);
                }
            }
            scheduleUpdate();
            renderFullSummary();
        } catch (err) { console.error('Ошибка API:', err); }
    }

    // ========== КАРТА ==========
    const map = new ol.Map({
        target: 'map',
        layers: [new ol.layer.Tile({ source: new ol.source.XYZ({ url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', subdomains: 'abcd' }) })],
        view: new ol.View({ center: ol.proj.fromLonLat([60, 65]), zoom: 4, minZoom: 3, maxZoom: 10, enableRotation: false }),
        controls: []
    });

    let clearSource = new ol.source.Vector();
    let dangerSource = new ol.source.Vector();
    let attackSource = new ol.source.Vector();
    let missileSource = new ol.source.Vector();

    const clearStyle = new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(26, 26, 26, 0.6)' }), stroke: new ol.style.Stroke({ color: '#555555', width: 2 }) });
    const dangerStyle = new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(179, 134, 0, 0.75)' }), stroke: new ol.style.Stroke({ color: '#ffdd66', width: 2 }) });
    const attackStyle = new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(204, 26, 26, 0.8)' }), stroke: new ol.style.Stroke({ color: '#ff8888', width: 2 }) });
    const missileStyle = new ol.style.Style({ fill: new ol.style.Fill({ color: 'rgba(102, 0, 0, 0.85)' }), stroke: new ol.style.Stroke({ color: '#ffaaaa', width: 2 }) });

    map.addLayer(new ol.layer.Vector({ source: clearSource, style: clearStyle, zIndex: 5 }));
    map.addLayer(new ol.layer.Vector({ source: dangerSource, style: dangerStyle, zIndex: 6 }));
    map.addLayer(new ol.layer.Vector({ source: attackSource, style: attackStyle, zIndex: 7 }));
    map.addLayer(new ol.layer.Vector({ source: missileSource, style: missileStyle, zIndex: 8 }));

    const labelSource = new ol.source.Vector();
    const labelLayer = new ol.layer.Vector({
        source: labelSource,
        style: (feature) => {
            const zoom = map.getView().getZoom();
            let name = feature.get('name');
            if (!name || zoom < 3) return new ol.style.Style();
            
            const shortNames = {
                "Республика Татарстан": "Татарстан",
                "Республика Башкортостан": "Башкортостан",
                "Удмуртская Республика": "Удмуртия",
                "Чувашская Республика": "Чувашия",
                "Республика Марий Эл": "Марий Эл",
                "Краснодарский край": "Краснодарский кр.",
                "Ставропольский край": "Ставропольский кр.",
                "Пермский край": "Пермский кр.",
                "Приморский край": "Приморский кр."
            };
            const displayName = shortNames[name] || name;
            const lines = displayName.includes(' ') && displayName.length - displayName.indexOf(' ') < 25 
                ? [displayName.substring(0, displayName.indexOf(' ')), displayName.substring(displayName.indexOf(' ') + 1)]
                : [displayName];
            const fontSize = zoom < 5 ? '10px' : '12px';
            return new ol.style.Style({
                text: new ol.style.Text({
                    text: lines.join('\n'),
                    font: `500 ${fontSize} "Segoe UI"`,
                    fill: new ol.style.Fill({ color: '#ffffff' }),
                    stroke: new ol.style.Stroke({ color: '#000000', width: 2.5 }),
                    textAlign: 'center'
                })
            });
        },
        zIndex: 20,
        declutter: true
    });
    map.addLayer(labelLayer);

    // Загрузка GeoJSON
    fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/russia.geojson')
        .then(r => r.json())
        .then(geojson => {
            const format = new ol.format.GeoJSON();
            const features = format.readFeatures(geojson, { featureProjection: 'EPSG:3857' });
            
            let moscowRegionFeatures = [];
            
            features.forEach(feature => {
                let name = feature.get('name');
                if (!name) return;
                if (EXCLUDED_REGIONS.some(ex => name.includes(ex))) return;
                
                const normalized = normalizeGeoJsonName(name);
                feature.set('name', normalized);
                
                if (normalized === "Московская область") {
                    moscowRegionFeatures.push(feature);
                    return;
                }
                
                if (normalized === "Москва") {
                    allFeaturesMap.set("Москва", feature);
                    return;
                }
                
                if (allFeaturesMap.has(normalized)) {
                    const existing = allFeaturesMap.get(normalized);
                    const collection = new ol.geom.GeometryCollection([existing.getGeometry(), feature.getGeometry()]);
                    existing.setGeometry(collection);
                } else {
                    allFeaturesMap.set(normalized, feature);
                }
            });
            
            if (moscowRegionFeatures.length > 0) {
                const geoms = moscowRegionFeatures.map(f => f.getGeometry());
                const merged = moscowRegionFeatures[0].clone();
                merged.setGeometry(new ol.geom.GeometryCollection(geoms));
                merged.set('name', "Московская область");
                allFeaturesMap.set("Московская область", merged);
            }
            
            // Добавляем метки
            for (let [name, feature] of allFeaturesMap) {
                const geom = feature.getGeometry();
                let center = null;
                if (geom.getType() === 'MultiPolygon') {
                    let maxArea = 0, largest;
                    if (geom.getPolygons) {
                        geom.getPolygons().forEach(p => {
                            const area = p.getArea();
                            if (area > maxArea) { maxArea = area; largest = p; }
                        });
                        if (largest) center = largest.getInteriorPoint();
                    }
                } else if (geom.getType() === 'Polygon') {
                    center = geom.getInteriorPoint();
                } else if (geom.getType() === 'GeometryCollection') {
                    const geoms = geom.getGeometries();
                    for (let g of geoms) {
                        if (g.getType() === 'Polygon') {
                            center = g.getInteriorPoint();
                            break;
                        } else if (g.getType() === 'MultiPolygon' && g.getPolygons) {
                            const polys = g.getPolygons();
                            if (polys.length > 0) {
                                center = polys[0].getInteriorPoint();
                                break;
                            }
                        }
                    }
                }
                if (center && !labelSource.getFeatures().some(f => f.get('name') === name)) {
                    labelSource.addFeature(new ol.Feature({ geometry: center, name: name }));
                }
            }
            
            updateAllLayers();
            renderFullSummary();
            connectWebSocket();
            fetchApiAlerts();
            setInterval(fetchApiAlerts, 30000);
        })
        .catch(console.error);

    function updateAllLayers() {
        clearSource.clear();
        dangerSource.clear();
        attackSource.clear();
        missileSource.clear();
        
        for (let [name, feature] of allFeaturesMap) {
            const status = getRegionStatus(name);
            const clone = feature.clone();
            clone.set('name', name);
            
            if (status === 'missile_alert') missileSource.addFeature(clone);
            else if (status === 'drone_attack') attackSource.addFeature(clone);
            else if (status === 'drone_danger') dangerSource.addFeature(clone);
            else clearSource.addFeature(clone);
        }
        map.render();
    }

    function renderFullSummary() {
        let attack = [], danger = [];
        for (let [name, status] of regionStatuses.entries()) {
            if (status === 'missile_alert' || status === 'drone_attack') attack.push(name);
            else if (status === 'drone_danger') danger.push(name);
        }
        attack.sort(); danger.sort();
        
        const dateTimeStr = getFullDateForSummary();
        let html = '';
        html += `<div class="summary-time">🕐 ${dateTimeStr}</div>`;
        html += `<div class="threat-header">🔴 Атака / Внимание БПЛА / ракет</div><div class="region-list-block">`;
        if (attack.length) attack.forEach(r => html += `<span class="region-line" data-region="${r}">• ${r}</span>`);
        else html += `<div class="empty-message">— нет угроз —</div>`;
        html += `</div><div class="sub-header">🟡 Опасность БПЛА</div><div class="region-list-block">`;
        if (danger.length) danger.forEach(r => html += `<span class="region-line" data-region="${r}">• ${r}</span>`);
        else html += `<div class="empty-message">— нет угроз —</div>`;
        html += `</div>`;
        document.getElementById('dynamicSummaryBlock').innerHTML = html;
        
        document.querySelectorAll('.region-line').forEach(el => {
            el.addEventListener('click', () => {
                const regionName = el.dataset.region;
                const feature = allFeaturesMap.get(regionName);
                if (feature) map.getView().fit(feature.getGeometry().getExtent(), { padding: [50,50,50,50], maxZoom: 8 });
            });
        });
    }

    document.getElementById('copySummaryBtn').addEventListener('click', () => {
        let attack = [], danger = [];
        for (let [name, status] of regionStatuses.entries()) {
            if (status === 'missile_alert' || status === 'drone_attack') attack.push(name);
            else if (status === 'drone_danger') danger.push(name);
        }
        const dateTimeStr = getFullDateForSummary();
        let text = `✈️ Тревоги на территории РФ ${dateTimeStr}\n\n🔴 АКТИВНАЯ ТРЕВОГА (БПЛА/Ракеты):\n`;
        if (attack.length) attack.forEach(r => text += `  • ${r}\n`);
        else text += `  — нет угроз —\n`;
        text += `\n🟡 ПОТЕНЦИАЛЬНАЯ ОПАСНОСТЬ (БПЛА):\n`;
        if (danger.length) danger.forEach(r => text += `  • ${r}\n`);
        else text += `  — нет угроз —\n`;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copySummaryBtn');
        btn.textContent = '✅ Скопировано!';
        setTimeout(() => btn.textContent = '📋 Копировать сводку', 1500);
    });

    // Попап
    const popupDiv = document.createElement('div'); popupDiv.className = 'ol-popup';
    const popupCloser = document.createElement('a'); popupCloser.href = '#'; popupCloser.className = 'popup-closer'; popupCloser.innerHTML = '×';
    popupCloser.onclick = () => { popupOverlay.setPosition(undefined); return false; };
    popupDiv.appendChild(popupCloser);
    const popupContent = document.createElement('div');
    popupDiv.appendChild(popupContent);
    const popupOverlay = new ol.Overlay({ element: popupDiv, autoPan: true, offset: [10, -10] });
    map.addOverlay(popupOverlay);
    
    map.on('singleclick', (evt) => {
        let feature = null;
        const layers = [clearLayer, dangerLayer, attackLayer, missileLayer];
        for (const layer of layers) {
            map.forEachFeatureAtPixel(evt.pixel, (f) => { feature = f; return true; }, { layerFilter: (l) => l === layer });
            if (feature) break;
        }
        if (feature) {
            const name = feature.get('name');
            const status = getRegionStatus(name);
            let html = `<div style="font-weight: bold; font-size: 14px; margin-bottom: 6px; border-bottom: 1px solid #333;">${name}</div>`;
            if (status === 'missile_alert') html += `<div style="color: #ff6666; font-weight: bold;">🚀 РАКЕТНАЯ ОПАСНОСТЬ</div>`;
            else if (status === 'drone_attack') html += `<div style="color: #ff6666; font-weight: bold;">🔴 ТРЕВОГА БПЛА</div>`;
            else if (status === 'drone_danger') html += `<div style="color: #ffcc66; font-weight: bold;">🟡 ОПАСНОСТЬ БПЛА</div>`;
            else html += `<div style="color: #80c080;">🟢 Отбой / спокойно</div>`;
            popupContent.innerHTML = html;
            popupOverlay.setPosition(evt.coordinate);
        } else {
            popupOverlay.setPosition(undefined);
        }
    });

    // Свёртывание
    document.getElementById('legendHeader').addEventListener('click', () => {
        const items = document.getElementById('legendItems');
        const isHidden = items.style.display === 'none';
        items.style.display = isHidden ? 'flex' : 'none';
        document.getElementById('legendToggle').innerHTML = isHidden ? '▼' : '▲';
    });
    document.getElementById('summaryHeader').addEventListener('click', () => {
        const content = document.getElementById('summaryContent');
        const isCollapsed = content.classList.contains('collapsed');
        if (isCollapsed) {
            content.classList.remove('collapsed');
            document.getElementById('summaryArrow').innerHTML = '▼';
        } else {
            content.classList.add('collapsed');
            document.getElementById('summaryArrow').innerHTML = '▲';
        }
    });

    function updateOrbitClock() {
        const { time } = getCurrentTimeParts();
        const dateStr = getFullDateForClock();
        document.getElementById('orbitTime').innerHTML = time;
        document.getElementById('orbitDate').innerHTML = dateStr;
    }
    updateOrbitClock();
    setInterval(updateOrbitClock, 1000);
</script>
